name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to release, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.26.0"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          release_tag="${INPUT_TAG:-${REF_NAME}}"

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use semantic version format, for example v0.3.0."
            exit 1
          fi

          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          make build-linux
          mkdir -p dist
          tar -czf "dist/wf-account-job_${RELEASE_TAG}_linux_amd64.tar.gz" \
            job_rpc \
            .env.example \
            .env.job.example \
            etc
          shasum -a 256 \
            "dist/wf-account-job_${RELEASE_TAG}_linux_amd64.tar.gz" \
            > "dist/wf-account-job_${RELEASE_TAG}_linux_amd64.tar.gz.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            dist/*

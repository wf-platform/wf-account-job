name: Publish release to public repository

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create in the public repository, for example v0.1.0"
        required: true
      target_repository:
        description: "Public repository to update"
        required: true
        default: "wf-platform/wf-account-public"
      target_branch:
        description: "Target branch in the public repository"
        required: true
        default: "master"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true

      - name: Check token
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN || secrets.WF_PLATFORM_READ_TOKEN }}
        run: |
          if [ -z "$PUBLIC_REPO_TOKEN" ]; then
            echo "Missing repository secret: PUBLIC_REPO_TOKEN"
            echo "WF_PLATFORM_READ_TOKEN is also supported as a fallback if it has write access."
            echo "Create a fine-grained PAT with Contents: Read and write access to the public repository."
            exit 1
          fi

      - name: Build release artifact
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          make build-linux
          mkdir -p dist
          tar -czf "dist/wf-account-job_${RELEASE_TAG}_linux_amd64.tar.gz" job_rpc .env.job.example
          shasum -a 256 "dist/wf-account-job_${RELEASE_TAG}_linux_amd64.tar.gz" > "dist/wf-account-job_${RELEASE_TAG}_linux_amd64.tar.gz.sha256"

      - name: Create public GitHub release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN || secrets.WF_PLATFORM_READ_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --repo "${TARGET_REPOSITORY}" \
            --target "${TARGET_BRANCH}" \
            --title "${RELEASE_TAG}" \
            --notes "Built from private wf-account-job commit ${GITHUB_SHA}." \
            dist/*
